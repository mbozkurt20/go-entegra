<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap - Entegra Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md px-4">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">Entegra Panel</h1>
    <p class="text-gray-400 mt-1">Pazaryeri Entegrasyon Yönetimi</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-800">
    <h2 class="text-xl font-semibold text-white mb-6">Giriş Yap</h2>

    <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg px-4 py-3 mb-4 text-sm"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">E-posta</label>
        <input type="email" id="email" required placeholder="ornek@mail.com"
          class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Şifre</label>
        <input type="password" id="password" required placeholder="••••••"
          class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg py-2.5 text-sm transition mt-2">
        Giriş Yap
      </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      Hesabın yok mu?
      <a href="/panel/register" class="text-indigo-400 hover:text-indigo-300 font-medium">Kayıt Ol</a>
    </p>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) window.location.href = '/panel/dashboard';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Giriş yapılıyor...';
    btn.disabled = true;

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Giriş başarısız');
      localStorage.setItem('token', data.token);
      localStorage.setItem('business', JSON.stringify(data.business));
      window.location.href = '/panel/dashboard';
    } catch (err) {
      const el = document.getElementById('error');
      el.textContent = err.message;
      el.classList.remove('hidden');
      btn.textContent = 'Giriş Yap';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
